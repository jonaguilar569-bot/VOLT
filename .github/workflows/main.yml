name: Compilar APK de VOLT

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  generar-apk:
    name: Generar APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes del SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Descargar Gradle 9.3.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip

      - name: Dar permisos de ejecución
        run: chmod +x gradle-9.3.1/bin/gradle

      - name: Compilar APK Debug
        run: |
          ./gradle-9.3.1/bin/gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Guardar APK compilada
        uses: actions/upload-artifact@v4
        with:
          name: VOLT-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
