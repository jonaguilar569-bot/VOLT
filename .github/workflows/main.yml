name: Compilar APK de VOLT

on:
  workflow_dispatch:
  push:
    branches:
      - principal
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Generar APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes de Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos al Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Compilar APK de prueba
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Guardar APK compilada
        uses: actions/upload-artifact@v4
        with:
          name: VOLT-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
