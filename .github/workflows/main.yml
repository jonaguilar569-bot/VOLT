name: Compilar APK de VOLT

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Generar APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Compilar APK de prueba
        run: gradle :app:assembleDebug --stacktrace

      - name: Guardar APK compilada
        uses: actions/upload-artifact@v4
        with:
          name: VOLT-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
